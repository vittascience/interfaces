name: Update mobile manifest

on:
  push:
    branches: [master]
    paths-ignore: ['manifest/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Build manifest
        run: python3 .github/scripts/build-manifest.py

      - name: Commit and push if changed
        run: |
          git add -A manifest
          if git diff --cached --quiet -- manifest; then
            echo "Manifest unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update manifest [skip ci]"
          git push origin HEAD:master
